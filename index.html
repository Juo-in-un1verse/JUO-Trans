<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091020">
  <title>Juo's personal translator</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#091020] text-slate-100 min-h-screen pb-12 font-sans">

  <header class="bg-[#0f1930] border-b border-blue-900/50 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-extrabold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">Juo's personal translator</h1>
        <p class="text-[11px] text-blue-300/70">Polite Male Spoken Thai (ครับ / นะครับ)</p>
      </div>
      <button type="button" onclick="toggleApiBox()" class="text-xs bg-[#172544] text-cyan-300 px-3 py-1.5 rounded-lg border border-blue-800/60">🔑 API Key</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="apiBox" class="bg-[#111c35] p-4 rounded-xl border border-cyan-500/40 space-y-2 hidden">
      <label class="block text-xs text-cyan-300">Google Gemini API Key ထည့်ပါ</label>
      <div class="flex gap-2">
        <input id="apiKeyInput" type="password" placeholder="API Key ဒီမှာ Paste ချပါ" class="w-full bg-[#091020] border border-blue-900 rounded-lg px-3 py-2 text-sm text-white">
        <button type="button" onclick="saveApiKey()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save</button>
      </div>
    </div>

    <div class="bg-[#111c35] p-1.5 rounded-xl grid grid-cols-2 gap-1.5 border border-blue-900/50">
      <button type="button" id="tonePolite" onclick="setTone('polite')" class="py-2.5 px-3 rounded-lg text-xs font-bold bg-gradient-to-r from-blue-600 to-cyan-600 text-white">👔 ယဉ်ကျေး/လုပ်ငန်းခွင် (ครับ)</button>
      <button type="button" id="toneFriendly" onclick="setTone('friendly')" class="py-2.5 px-3 rounded-lg text-xs font-semibold text-slate-300">😊 ရင်းနှီး/နေ့စဉ်သုံး (นะครับ)</button>
    </div>

    <div class="bg-[#111c35] p-4 rounded-xl border border-blue-900/50 space-y-3">
      <div class="flex justify-between items-center gap-2">
        <span class="text-xs text-blue-300/80">မြန်မာစာ သို့မဟုတ် ထိုင်းစာ ရိုက်ထည့်ပါ</span>
        <div class="flex items-center gap-2">
          <button type="button" onclick="startVoiceInput()" class="text-xs bg-[#192a4d] text-cyan-300 px-2.5 py-1 rounded-lg border border-blue-800/60">🎙️ <span id="voiceBtnText">အသံဖြင့်ရိုက်ရန်</span></button>
          <button type="button" onclick="clearInput()" class="text-xs text-rose-400">အကုန်ဖျက်မည်</button>
        </div>
      </div>

      <textarea id="inputText" rows="3" placeholder="ဥပမာ - အကို benz နေကောင်းလား..." class="w-full bg-[#091020] border border-blue-900/70 rounded-xl p-3 text-base text-white"></textarea>

      <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
        <button type="button" onclick="quickFill('နားလည်ပါပြီအကို')" class="bg-[#192a4d] text-cyan-200 border border-blue-800/50 px-3 py-1.5 rounded-full shrink-0">နားလည်ပါပြီအကို</button>
        <button type="button" onclick="quickFill('ကျေးဇူးပါအကို')" class="bg-[#192a4d] text-cyan-200 border border-blue-800/50 px-3 py-1.5 rounded-full shrink-0">ကျေးဇူးပါအကို</button>
        <button type="button" onclick="quickFill('ဟုတ်ကဲ့ပါအကို')" class="bg-[#192a4d] text-cyan-200 border border-blue-800/50 px-3 py-1.5 rounded-full shrink-0">ဟုတ်ကဲ့ပါအကို</button>
      </div>

      <button type="button" id="translateBtn" onclick="translateText()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 active:opacity-90 text-white font-bold py-3.5 rounded-xl shadow-lg">
        ✨ ဘာသာပြန်မည် (Translate)
      </button>
    </div>

    <div id="loading" class="hidden text-center py-4 text-cyan-400 text-sm animate-pulse">
      ⚡ ဘာသာပြန်နေပါသည် (၃ စက္ကန့်ခန့် စောင့်ပေးပါ)...
    </div>

    <div id="resultContainer" class="space-y-3 hidden">
      <div class="bg-[#111c35] p-4 rounded-xl border border-cyan-500/40 space-y-2.5">
        <div class="flex justify-between items-center flex-wrap gap-1.5">
          <span class="text-xs font-bold text-cyan-400">🇹🇭 THAI (POLITE MALE - ครับ)</span>
          <div class="flex gap-1.5">
            <button type="button" id="favCurrentBtn" onclick="toggleCurrentFavorite()" class="bg-[#192a4d] px-2.5 py-1 rounded-lg text-xs border border-blue-800/60">☆</button>
            <button type="button" onclick="speakThai('thaiOutput', 1.0)" class="bg-[#192a4d] text-blue-200 px-2.5 py-1 rounded-lg text-xs border border-blue-800/60">🔊 အသံ</button>
            <button type="button" onclick="speakThai('thaiOutput', 0.65)" class="bg-[#192a4d] text-cyan-300 px-2.5 py-1 rounded-lg text-xs border border-blue-800/60">🐢 အနှေး</button>
            <button type="button" onclick="copyText('thaiOutput', this)" class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white px-3 py-1 rounded-lg text-xs font-bold">📋 Copy</button>
          </div>
        </div>
        <p id="thaiOutput" class="text-xl font-semibold text-white select-all"></p>
        <p id="thaiPronunciation" class="text-xs text-cyan-300 bg-[#091020] p-2.5 rounded-lg"></p>
      </div>

      <div class="bg-[#111c35] p-4 rounded-xl border border-blue-900/50 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-sky-400">🇲🇲 MYANMAR (ဆိုလိုရင်း အဓိပ္ပာယ်)</span>
          <button type="button" onclick="copyText('mmOutput', this)" class="bg-[#192a4d] text-slate-200 px-3 py-1 rounded-lg text-xs">📋 Copy MM</button>
        </div>
        <p id="mmOutput" class="text-base text-slate-100 select-all"></p>
      </div>

      <div class="bg-[#111c35] p-4 rounded-xl border border-blue-900/50 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-indigo-400">🇬🇧 ENGLISH TRANSLATION</span>
          <button type="button" onclick="copyText('enOutput', this)" class="bg-[#192a4d] text-slate-200 px-3 py-1 rounded-lg text-xs">📋 Copy EN</button>
        </div>
        <p id="enOutput" class="text-base text-slate-100 select-all"></p>
      </div>
    </div>

    <div class="bg-[#111c35] p-4 rounded-xl border border-blue-900/50 space-y-3">
      <div class="flex items-center justify-between border-b border-blue-900/50 pb-2">
        <div class="flex gap-2">
          <button type="button" id="tabRecent" onclick="switchHistoryTab('recent')" class="text-xs font-bold px-3 py-1 rounded-lg bg-blue-600 text-white">🕘 မှတ်တမ်း (Recent)</button>
          <button type="button" id="tabFav" onclick="switchHistoryTab('fav')" class="text-xs font-semibold px-3 py-1 rounded-lg text-slate-400">⭐ သိမ်းထားသောစာများ</button>
        </div>
        <button type="button" onclick="clearHistory()" class="text-[11px] text-rose-400">မှတ်တမ်းဖျက်ရန်</button>
      </div>
      <div id="historyList" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-400"></div>
    </div>
  </main>

  <script>
    var currentTone = 'polite';
    var historyTab = 'recent';
    var lastItem = null;

    window.onload = function() {
      var savedKey = localStorage.getItem('gemini_api_key');
      if (!savedKey) {
        document.getElementById('apiBox').classList.remove('hidden');
      } else {
        document.getElementById('apiKeyInput').value = savedKey;
      }
      renderHistory();
    };

    function toggleApiBox() {
      document.getElementById('apiBox').classList.toggle('hidden');
    }

    function saveApiKey() {
      var key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return alert('API Key ထည့်ပေးပါ');
      localStorage.setItem('gemini_api_key', key);
      document.getElementById('apiBox').classList.add('hidden');
      alert('API Key သိမ်းဆည်းပြီးပါပြီ!');
    }

    function setTone(tone) {
      currentTone = tone;
      var active = 'py-2.5 px-3 rounded-lg text-xs font-bold bg-gradient-to-r from-blue-600 to-cyan-600 text-white';
      var inactive = 'py-2.5 px-3 rounded-lg text-xs font-semibold text-slate-300';
      document.getElementById('tonePolite').className = (tone === 'polite') ? active : inactive;
      document.getElementById('toneFriendly').className = (tone === 'friendly') ? active : inactive;
    }

    function quickFill(text) {
      document.getElementById('inputText').value = text;
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
      document.getElementById('resultContainer').classList.add('hidden');
    }

    function startVoiceInput() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('သင့် Browser တွင် အသံဖြင့်စာရိုက်စနစ် မပံ့ပိုးပါ');
      var rec = new SR();
      rec.lang = 'my-MM';
      document.getElementById('voiceBtnText').innerText = 'နားထောင်နေသည်...';
      rec.onresult = function(e) {
        document.getElementById('inputText').value = e.results[0][0].transcript;
      };
      rec.onend = function() {
        document.getElementById('voiceBtnText').innerText = 'အသံဖြင့်ရိုက်ရန်';
      };
      rec.onerror = function() {
        document.getElementById('voiceBtnText').innerText = 'အသံဖြင့်ရိုက်ရန်';
      };
      rec.start();
    }

    async function translateText() {
      var apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        document.getElementById('apiBox').classList.remove('hidden');
        return alert('API Key အရင်ထည့်ပေးပါ');
      }
      var text = document.getElementById('inputText').value.trim();
      if (!text) return alert('စာသား ရိုက်ထည့်ပါ');

      var loading = document.getElementById('loading');
      var resultContainer = document.getElementById('resultContainer');
      var btn = document.getElementById('translateBtn');

      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      btn.disabled = true;

      var toneDesc = (currentTone === 'polite') ? 'polite male workplace Thai (ครับ)' : 'friendly casual male Thai (ครับ/นะครับ)';
      var prompt = 'Translate "' + text + '" into ' + toneDesc + ', Myanmar, and English. Return ONLY JSON: {"thai_text":"...","thai_pronunciation_mm":"...","myanmar_text":"...","english_text":"..."}';

      try {
        var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + apiKey, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
          })
        });
        var data = await res.json();
        if (data.error) throw new Error(data.error.message);

        var result = JSON.parse(data.candidates[0].content.parts[0].text);
        document.getElementById('thaiOutput').innerText = result.thai_text || '';
        document.getElementById('thaiPronunciation').innerText = '🗣️ အသံထွက် - ' + (result.thai_pronunciation_mm || '');
        document.getElementById('mmOutput').innerText = result.myanmar_text || '';
        document.getElementById('enOutput').innerText = result.english_text || '';

        lastItem = {
          id: Date.now(),
          input: text,
          thai: result.thai_text || '',
          pron: result.thai_pronunciation_mm || '',
          mm: result.myanmar_text || '',
          en: result.english_text || '',
          fav: false
        };
        saveToHistory(lastItem);
        updateFavBtn();
        resultContainer.classList.remove('hidden');
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        loading.classList.add('hidden');
        btn.disabled = false;
      }
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem('juo_history') || '[]'); } catch (e) { return []; }
    }

    function saveToHistory(item) {
      var list = getHistory();
      for (var i = 0; i < list.length; i++) {
        if (list[i].input === item.input) {
          item.fav = list[i].fav;
          list.splice(i, 1);
          break;
        }
      }
      list.unshift(item);
      if (list.length > 20) list = list.slice(0, 20);
      localStorage.setItem('juo_history', JSON.stringify(list));
      renderHistory();
    }

    function toggleCurrentFavorite() {
      if (!lastItem) return;
      var list = getHistory();
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === lastItem.id || list[i].input === lastItem.input) {
          list[i].fav = !list[i].fav;
          lastItem.fav = list[i].fav;
          break;
        }
      }
      localStorage.setItem('juo_history', JSON.stringify(list));
      updateFavBtn();
      renderHistory();
    }

    function updateFavBtn() {
      document.getElementById('favCurrentBtn').innerText = (lastItem && lastItem.fav) ? '⭐' : '☆';
    }

    function switchHistoryTab(tab) {
      historyTab = tab;
      document.getElementById('tabRecent').className = (tab === 'recent') ? 'text-xs font-bold px-3 py-1 rounded-lg bg-blue-600 text-white' : 'text-xs font-semibold px-3 py-1 rounded-lg text-slate-400';
      document.getElementById('tabFav').className = (tab === 'fav') ? 'text-xs font-bold px-3 py-1 rounded-lg bg-blue-600 text-white' : 'text-xs font-semibold px-3 py-1 rounded-lg text-slate-400';
      renderHistory();
    }

    function renderHistory() {
      var box = document.getElementById('historyList');
      var list = getHistory();
      var items = [];
      for (var i = 0; i < list.length; i++) {
        if (historyTab !== 'fav' || list[i].fav) items.push(list[i]);
      }
      box.innerHTML = '';
      if (items.length === 0) {
        box.innerText = (historyTab === 'fav') ? '⭐ သိမ်းထားသော စာကြောင်း မရှိသေးပါ' : 'ဘာသာပြန်မှတ်တမ်း မရှိသေးပါ';
        return;
      }
      items.forEach(function(item) {
        var row = document.createElement('div');
        row.className = 'bg-[#091020] p-2.5 rounded-xl border border-blue-900/40 flex justify-between items-center gap-2 cursor-pointer';
        row.onclick = function() { loadItem(item.id); };

        var textDiv = document.createElement('div');
        textDiv.className = 'overflow-hidden';
        var p1 = document.createElement('p');
        p1.className = 'text-sm font-semibold text-cyan-300 truncate';
        p1.innerText = item.thai;
        var p2 = document.createElement('p');
        p2.className = 'text-xs text-slate-400 truncate';
        p2.innerText = item.mm;
        textDiv.appendChild(p1);
        textDiv.appendChild(p2);

        var starBtn = document.createElement('button');
        starBtn.className = 'text-sm px-2 py-1';
        starBtn.innerText = item.fav ? '⭐' : '☆';
        starBtn.onclick = function(e) {
          e.stopPropagation();
          toggleItemFav(item.id);
        };

        row.appendChild(textDiv);
        row.appendChild(starBtn);
        box.appendChild(row);
      });
    }

    function toggleItemFav(id) {
      var list = getHistory();
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          list[i].fav = !list[i].fav;
          if (lastItem && lastItem.id === id) lastItem.fav = list[i].fav;
          break;
        }
      }
      localStorage.setItem('juo_history', JSON.stringify(list));
      updateFavBtn();
      renderHistory();
    }

    function loadItem(id) {
      var list = getHistory();
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          lastItem = list[i];
          document.getElementById('inputText').value = lastItem.input;
          document.getElementById('thaiOutput').innerText = lastItem.thai;
          document.getElementById('thaiPronunciation').innerText = '🗣️ အသံထွက် - ' + lastItem.pron;
          document.getElementById('mmOutput').innerText = lastItem.mm;
          document.getElementById('enOutput').innerText = lastItem.en;
          updateFavBtn();
          document.getElementById('resultContainer').classList.remove('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        }
      }
    }

    function clearHistory() {
      var favs = getHistory().filter(function(x) { return x.fav; });
      localStorage.setItem('juo_history', JSON.stringify(favs));
      renderHistory();
    }

    function copyText(id, btn) {
      var text = document.getElementById(id).innerText;
      var temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      var old = btn.innerText;
      btn.innerText = '✅ Copied!';
      setTimeout(function() { btn.innerText = old; }, 1500);
    }

    function speakThai(id, rate) {
      var text = document.getElementById(id).innerText;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'th-TH';
        u.rate = rate || 1.0;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
